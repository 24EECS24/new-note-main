<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>函数渐近线求解流程</title>
</head>
<body style="margin:0;padding:20px;background:transparent;">
<svg viewBox="0 0 1000 480" width="100%" xmlns="http://www.w3.org/2000/svg"
     class="tzjx" font-family="'Songti SC','SimSun',serif">
  <style>
    svg.tzjx{color:#161616;}
    @media (prefers-color-scheme: dark){
      svg.tzjx{color:#e8e8e8;}
      rect.tikz-bg{display:none;}
    }
  </style>

  <rect class="tikz-bg" x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 起点 -->
  <rect x="180" y="40" width="100" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="66" text-anchor="middle" fill="currentColor" font-size="20" font-weight="600">y = f(x)</text>

  <!-- 右列 -->
  <rect x="380" y="30" width="200" height="56" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="480" y="55" text-anchor="middle" fill="currentColor" font-size="18">lim f(x) = A ∈ 常数</text>
  <text x="480" y="76" text-anchor="middle" fill="currentColor" font-size="14">(x → ∞)</text>
  <line x1="280" y1="60" x2="375" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="660" y="20" width="210" height="80" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="765" y="48" text-anchor="middle" fill="currentColor" font-size="18">水平渐近线 y = A</text>
  <text x="765" y="70" text-anchor="middle" fill="currentColor" font-size="14">且 x → ∞ 方向上</text>
  <text x="765" y="90" text-anchor="middle" fill="currentColor" font-size="14">无斜渐近线</text>
  <line x1="580" y1="60" x2="655" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="617" y="52" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">是</text>

  <line x1="480" y1="86" x2="480" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="112" fill="currentColor" font-size="15" font-weight="600">否（A 为 ∞）</text>

  <rect x="380" y="135" width="210" height="56" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="485" y="160" text-anchor="middle" fill="currentColor" font-size="18">lim f(x)/x = a</text>
  <text x="485" y="181" text-anchor="middle" fill="currentColor" font-size="14">(a 为非零常数)</text>

  <rect x="660" y="145" width="140" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="170" text-anchor="middle" fill="currentColor" font-size="16">无斜渐近线</text>
  <line x1="590" y1="163" x2="655" y2="163" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="155" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">否</text>

  <line x1="485" y1="191" x2="485" y2="235" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="218" fill="currentColor" font-size="15" font-weight="600">是</text>

  <rect x="375" y="240" width="220" height="56" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="485" y="265" text-anchor="middle" fill="currentColor" font-size="18">b = lim [ f(x) − a x ]</text>
  <text x="485" y="286" text-anchor="middle" fill="currentColor" font-size="14">(x → ∞)</text>

  <rect x="660" y="250" width="140" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="275" text-anchor="middle" fill="currentColor" font-size="16">无斜渐近线</text>
  <line x1="595" y1="268" x2="655" y2="268" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="625" y="260" text-anchor="middle" fill="currentColor" font-size="14">b 不存在</text>

  <line x1="485" y1="296" x2="485" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="325" fill="currentColor" font-size="15" font-weight="600">b 存在</text>

  <rect x="395" y="350" width="180" height="56" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="485" y="375" text-anchor="middle" fill="currentColor" font-size="18">斜渐近线</text>
  <text x="485" y="396" text-anchor="middle" fill="currentColor" font-size="18">y = a x + b</text>

  <!-- 左列 -->
  <line x1="230" y1="80" x2="230" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="135" width="220" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="161" text-anchor="middle" fill="currentColor" font-size="18">找无定义点、端点、分段点</text>

  <line x1="230" y1="175" x2="230" y2="225" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="230" width="220" height="100" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="258" text-anchor="middle" fill="currentColor" font-size="18">lim f(x) = ∞</text>
  <text x="230" y="278" text-anchor="middle" fill="currentColor" font-size="14">(x → x₀⁺)</text>
  <text x="230" y="302" text-anchor="middle" fill="currentColor" font-size="18">或 lim f(x) = ∞</text>
  <text x="230" y="322" text-anchor="middle" fill="currentColor" font-size="14">(x → x₀⁻)</text>

  <rect x="10" y="255" width="120" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="70" y="280" text-anchor="middle" fill="currentColor" font-size="16">无铅直渐近线</text>
  <line x1="120" y1="275" x2="130" y2="275" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="115" y="267" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">否</text>

  <line x1="230" y1="330" x2="230" y2="370" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="356" fill="currentColor" font-size="15" font-weight="600">是</text>

  <rect x="130" y="375" width="200" height="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="401" text-anchor="middle" fill="currentColor" font-size="18">铅直渐近线 x = x₀</text>
</svg>
</body>
</html>
